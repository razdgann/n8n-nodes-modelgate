name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        # --ignore-scripts skips the native build of an optional transitive
        # dependency (isolated-vm) that is only used by the local `dev` runner
        # and is not needed for lint, build or tests.
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        # NOTE: live ModelGate calls (test:e2e) are intentionally NOT run in CI.
        # They require a real API key and are executed manually.
