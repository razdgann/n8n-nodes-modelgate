name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        # We use `npm install` (not `npm ci`) with --ignore-scripts:
        #   - --ignore-scripts skips the native build of an optional transitive
        #     dependency (isolated-vm, used only by the local `dev` runner) that
        #     is not needed for lint, build or tests.
        #   - `npm install` (vs `npm ci`) tolerates the optional/platform-specific
        #     native sub-deps (e.g. @emnapi/*) that make a cross-platform lockfile
        #     brittle under the strict `npm ci` check. The lockfile is still
        #     committed and honoured as the resolution baseline.
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        # NOTE: live ModelGate calls (test:e2e) are intentionally NOT run in CI.
        # They require a real API key and are executed manually.
